name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash
    working-directory: Engine/kotensor

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.os }}
          path: Engine/kotensor/build/reports/tests/test

  android-sample:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew -Pkotensor.android=true :sample-android:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kotensor-sample-debug-apk
          path: Engine/kotensor/sample-android/build/outputs/apk/debug/*.apk

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :benchmark:jmhJar --no-daemon
      - run: java -jar benchmark/build/libs/benchmark-*-jmh.jar -wi 1 -i 1 -f 1 -r 1 -w 1 "MatMulBenchmark.matmul512"
